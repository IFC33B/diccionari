<section class="p-6 bg-gray-900 h-full">
  <h1 class="text-3xl font-bold mb-20 text-center text-white">Diccionario</h1>

  <!-- Indicador de carga -->
  @if (carregant()) {
  <section class="flex flex-col items-center py-8">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-400 border-t-blue-600 mb-3"></div>
    <span class="text-gray-400 text-lg">Cargando palabra...</span>
  </section>
  }

  <!-- Mensaje de error -->
  @if (error()) {
  <section class="bg-red-900 text-red-400 text-center shadow-lg rounded-2xl p-6 mb-8 border border-red-700">
    <p class="mb-3 font-semibold text-lg">{{ error() }}</p>
    <button
      class="px-5 py-2 border border-red-400 text-red-400 rounded-full hover:bg-red-400 hover:text-black transition-all duration-300 shadow-md"
      (click)="cercarParaula()">
      Volver a intentar
    </button>
  </section>
  }

  <!-- Barra de búsqueda -->
  <form class="w-110 mb-20 mx-auto flex gap-10" (submit)="cercarParaula()">
    <input type="text" name="cerca" [(ngModel)]="cerca" placeholder="Buscar contacto..." class="w-full px-4 py-2 bg-gray-800 text-white text-lg rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" />

    <input type="submit" class="bg-blue-900 hover:bg-blue-950 text-black hover:text-white font-bold px-3 py-1 transition-all duration-300 transform hover:-translate-y-0.5 rounded-4xl">
  </form>

  @if (!paraula()) {

  <section class="flex justify-center h-1/2">
    <h1 class="my-auto text-4xl font-bold">Busca la palabra que quieras conocer!</h1>
  </section>

  } @else {
  <!-- Palabra -->
  <section class="w-full flex justify-center">
    <div class="bg-gray-800 rounded-lg shadow p-4 hover:bg-gray-700 transition w-full md:w-1/2">
      <h2 class="text-xl text-gray-300 font-semibold mb-2">{{paraula()?.terme}}</h2>
      <p class="text-gray-300 mb-1">{{paraula()?.definicio}}</p>
      <span class="inline-flex items-center px-2 py-0.5 mt-6 text-sm font-medium text-white bg-blue-800 rounded-full">ID #{{paraula()?.id}}</span>
    </div>
  </section>
  }
</section>
